name: LIN3H Purple Snake
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Lin3h
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#a855f7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
